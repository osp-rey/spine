<section class="sect-m s-connect">
  <div class="container">
    <div class="s-connect__body">
      <div class="s-connect__main">
        <img src="@img/hero-bg.png" alt="background" class="s-connect__main-bg">
        <h2 class="t-title s-connect__title">Не знаете, какая услуга вам нужна?</h2>
        <div class="content-box s-connect__content">
          <p>Оставьте заявку, и администратор подберет врача</p>
        </div>
        <form action="#" class="s-connect__form">
          <div class="form-grid">
            <div class="form-control">
              <input type="text" placeholder="Ваше имя" class="input" />
            </div>
            <div class="form-control">
              <input type="tel" placeholder="+7 (___) ___-__-__" class="input" />
            </div>
            <div class="form-control">
              <div class="check-wrap">
                <span class="wpcf7-form-control-wrap" data-name="f_agreement">
                  <span class="wpcf7-form-control wpcf7-acceptance">
                    <span class="wpcf7-list-item">
                      <label>
                        <input
                          type="checkbox"
                          name="f_agreement"
                          value="1"
                          aria-invalid="false"
                        />
                        <span class="wpcf7-list-item-label">
                          <span>
                            Я даю согласие на обработку указанных мной
                            персональных данных в соответствии с
                            <a href="/personal-data" target="_blank">
                              «Политикой обработки персональных данных»
                            </a>
                          </span>
                        </span>
                      </label>
                    </span>
                  </span>
                </span>
              </div>
            </div>
            <button class="btn-s _white">Отправить</button>
          </div>
        </form>
      </div>
      <img src="@img/connect.jpg" alt="image" class="s-connect__img">
    </div>
  </div>
</section>
